<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resume - MANNAV R. JAI$INGHANI</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,700;0,800;1,700;1,800&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  padding: 0;
  background: #e6e1d8;
  font-family: "Montserrat", sans-serif;
}

.header {
  background: #e6e1d8;
  padding: 20px;
  text-align: center;
  border-bottom: 1px solid #d0cbc1;
}

.back-btn {
  display: inline-block;
  color: #000;
  text-decoration: none;
  font-weight: 600;
  font-size: 16px;
  font-family: "Montserrat", sans-serif;
}

.back-btn:hover {
  text-decoration: underline;
}

.pdf-container {
  width: 100%;
  height: calc(100vh - 60px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}

.pdf-viewer {
  width: 100%;
  height: 100%;
  border: none;
}

.upload-section {
  text-align: center;
  padding: 60px 20px;
  max-width: 600px;
  margin: 0 auto;
}

.upload-section h2 {
  font-style: italic;
  font-weight: 800;
  color: #ff0000;
  margin-bottom: 20px;
  font-size: 32px;
}

.upload-section p {
  font-weight: 400;
  color: #666;
  margin-bottom: 30px;
  line-height: 1.6;
}

.file-input-wrapper {
  position: relative;
  display: inline-block;
}

.file-input-wrapper input[type="file"] {
  position: absolute;
  opacity: 0;
  width: 100%;
  height: 100%;
  cursor: pointer;
}

.upload-btn {
  display: inline-block;
  font-family: "Montserrat", sans-serif;
  font-weight: 700;
  font-size: 18px;
  color: #fff;
  background: #ff0000;
  padding: 14px 32px;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.3s ease;
  letter-spacing: 1px;
}

.upload-btn:hover {
  background: #cc0000;
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(255, 0, 0, 0.3);
}

.file-name {
  margin-top: 15px;
  font-weight: 700;
  color: #333;
}
</style>
</head>

<body>

<div class="header">
  <a href="index.html" class="back-btn">← back</a>
</div>

<div class="pdf-container" id="pdfContainer">
  <div class="upload-section" id="uploadSection">
    <h2>Upload Your Resume</h2>
    <p>Select a PDF file to display it here. The file will be shown full-screen for easy viewing.</p>
    
    <div class="file-input-wrapper">
      <label class="upload-btn">
        CHOOSE PDF FILE
        <input type="file" id="pdfInput" accept=".pdf" onchange="loadPDF(event)">
      </label>
    </div>
    
    <div class="file-name" id="fileName"></div>
  </div>
  
  <iframe id="pdfViewer" class="pdf-viewer" style="display: none;"></iframe>
</div>

<script>
function loadPDF(event) {
  const file = event.target.files[0];
  
  if (file && file.type === "application/pdf") {
    const fileURL = URL.createObjectURL(file);
    const viewer = document.getElementById("pdfViewer");
    const uploadSection = document.getElementById("uploadSection");
    const fileName = document.getElementById("fileName");
    
    viewer.src = fileURL;
    viewer.style.display = "block";
    uploadSection.style.display = "none";
    fileName.textContent = "Viewing: " + file.name;
  } else {
    alert("Please select a valid PDF file.");
  }
}

// Automatically load CV.pdf when page loads
window.onload = function() {
  document.getElementById("pdfViewer").src = "CV_Mannav_Jaisinghani.pdf";
  document.getElementById("pdfViewer").style.display = "block";
  document.getElementById("uploadSection").style.display = "none";
};
</script>

</body>
</html>
